<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password â€” TenancyHub</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth-final.css?v=1">
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <img class='auth-hero-logo' src='images/tenancyhub-logo.png' alt='TenancyHub'>
    <p>Choose a new password to finish resetting your account.</p>
    <ul>
      <li><span class="check"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span> Use at least 6 characters</li>
      <li><span class="check"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span> This link only works once</li>
      <li><span class="check"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span> You'll be signed in right after</li>
    </ul>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
<p class="auth-tagline">Choose a new password.</p>

      <p class="auth-error" id="authError" hidden></p>

      <form id="resetForm">
        <label>
          New password
          <div class="password-field-wrap">
            <input type="password" name="newPassword" id="resetPassword" minlength="6" required>
            <button type="button" class="password-toggle" data-toggle-for="resetPassword">Show</button>
          </div>
        </label>
        <button type="submit" class="btn btn-primary">Reset password</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to log in</a></p>
    </div>
  </div>
</div>
<script src="csrf.js"></script>
<script>
  document.querySelectorAll(".password-toggle").forEach((btn) => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.toggleFor);
      if (!input) return;
      const nowVisible = input.type === "password";
      input.type = nowVisible ? "text" : "password";
      btn.textContent = nowVisible ? "Hide" : "Show";
    });
  });

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const email = params.get("email");

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const newPassword = new FormData(e.target).get("newPassword");

    const res = await fetch("/api/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, token, newPassword }),
    });
    const data = await res.json();

    const errorBox = document.getElementById("authError");
    if (!res.ok) {
      errorBox.textContent = data.error;
      errorBox.hidden = false;
      return;
    }
    window.location.href = "login.html";
  });
</script>
</body>
</html>
