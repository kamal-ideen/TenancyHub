<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — TenancyHub</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <h1>TenancyHub</h1>
    <p>No stress — we'll get you back into your account in a couple of minutes.</p>
    <ul>
      <li><span class="check"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span> Reset link sent straight to your email</li>
      <li><span class="check"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span> Your data stays exactly as you left it</li>
      <li><span class="check"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span> Back to your dashboard in no time</li>
    </ul>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark">TH</span>
        <span class="brand-name" style="font-weight:700; font-size:18px; color: var(--navy);">TenancyHub</span>
      </div>
      <p class="auth-tagline">Enter your email and we'll send you a reset link.</p>

      <p class="auth-error" id="authError" hidden></p>
      <p class="auth-success" id="authSuccess" hidden></p>

      <form id="forgotForm">
        <label>
          Email
          <input type="email" name="email" required>
        </label>
        <button type="submit" class="btn btn-primary">Send reset link</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to log in</a></p>
    </div>
  </div>
</div>
<script src="csrf.js"></script>
<script>
  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = new FormData(e.target).get("email");

    const res = await fetch("/api/auth/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();

    document.getElementById("authError").hidden = true;
    const successBox = document.getElementById("authSuccess");
    successBox.textContent = data.message + " (If email isn't configured on this server, check the terminal window instead — the reset link is printed there.)";
    successBox.hidden = false;
  });
</script>
</body>
</html>
